<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="648" viewBox="0 0 250 162" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Watt Bank — Watt card template. 250 × 162 pt, corner radius 14. Export as 1000 × 648 PNG or as PDF. -->
  <defs>
    <linearGradient id="watt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAC733"/><stop offset="1" stop-color="#C78C0D"/>
    </linearGradient>
    <clipPath id="card"><rect width="250" height="162" rx="14" ry="14"/></clipPath>
  </defs>
  <g id="Card background" clip-path="url(#card)">
    <rect width="250" height="162" rx="14" ry="14" fill="url(#watt)"/>
  </g>
  <g id="Your artwork" clip-path="url(#card)">
    <!-- draw here; anything outside the rounded card is cut off -->
  </g>
  <g id="Guides - hide before exporting" opacity="0.85">
    <line x1="0" y1="81" x2="250" y2="81" stroke="#00A0FF" stroke-width="0.5" stroke-dasharray="3 2"/>
    <text x="17" y="100" font-family="Helvetica" font-size="5" fill="#0070DD">bottom half starts at this line</text>
    <rect x="8" y="9" width="234" height="30" rx="2" fill="#FFFFFF" fill-opacity="0.25" stroke="#FF2D78" stroke-width="0.6" stroke-dasharray="2 1.5"/>
    <text x="11" y="17" font-family="Helvetica" font-size="5.5" fill="#FF2D78">Title bar</text>
    <rect x="14" y="49" width="150" height="31" rx="2" fill="#FFFFFF" fill-opacity="0.25" stroke="#FF2D78" stroke-width="0.6" stroke-dasharray="2 1.5"/>
    <text x="17" y="57" font-family="Helvetica" font-size="5.5" fill="#FF2D78">Balance</text>
    <rect x="14" y="81" width="150" height="12" rx="2" fill="#FFFFFF" fill-opacity="0.25" stroke="#FF2D78" stroke-width="0.6" stroke-dasharray="2 1.5"/>
    <text x="17" y="89" font-family="Helvetica" font-size="5.5" fill="#FF2D78">Balance note</text>
    <rect x="184" y="60" width="52" height="22" rx="2" fill="#FFFFFF" fill-opacity="0.25" stroke="#FF2D78" stroke-width="0.6" stroke-dasharray="2 1.5"/>
    <text x="187" y="68" font-family="Helvetica" font-size="5.5" fill="#FF2D78">Chip + contactless</text>
    <rect x="14" y="129" width="130" height="19" rx="2" fill="#FFFFFF" fill-opacity="0.25" stroke="#FF2D78" stroke-width="0.6" stroke-dasharray="2 1.5"/>
    <text x="17" y="137" font-family="Helvetica" font-size="5.5" fill="#FF2D78">Trainer name</text>
    <rect x="186" y="138" width="50" height="10" rx="2" fill="#FFFFFF" fill-opacity="0.25" stroke="#FF2D78" stroke-width="0.6" stroke-dasharray="2 1.5"/>
    <text x="189" y="146" font-family="Helvetica" font-size="5.5" fill="#FF2D78">ID</text>
  </g>
</svg>
